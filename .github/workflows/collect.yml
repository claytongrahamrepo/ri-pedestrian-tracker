name: Collect incidents

on:
  schedule:
    - cron: "17 11 * * *" # daily, 7:17am ET
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to search Google News (use ~30 for backfill)"
        default: "3"
      max_articles:
        description: "Max articles to send to the model this run"
        default: "20"

permissions:
  contents: write
  models: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Discover candidate stories
        run: python scripts/discover.py
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}

      - name: Extract incidents with GitHub Models
        run: python scripts/extract.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ARTICLES: ${{ inputs.max_articles || '20' }}

      - name: Geocode incidents
        run: python scripts/geocode.py

      - name: Build map data
        run: python scripts/build_geojson.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update incident data ($(date -u +%Y-%m-%d))"
            git push
          fi
